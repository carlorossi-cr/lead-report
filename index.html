<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Accesso riservato</title>
<style>
:root{--bg:#F2F3F8;--panel:#fff;--line:#DFE2EE;--text:#252846;--dim:#6B7396;--brand:#5E74A2;--bad:#C9455F}
@media (prefers-color-scheme:dark){:root{--bg:#15172A;--panel:#1E2138;--line:#2E3352;--text:#E6E8F5;--dim:#9AA2C4;--brand:#8EA3D6;--bad:#E8768C}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);
  font:15px system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:360px}
h1{font-size:19px;margin:0 0 4px}
p{margin:0 0 20px;color:var(--dim);font-size:13px}
label{display:block;font-size:13px;color:var(--dim);margin:12px 0 4px}
input[type=text],input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--text);font:inherit}
.ric{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:13px;color:var(--dim)}
button{margin-top:18px;width:100%;padding:11px;border:0;border-radius:8px;background:var(--brand);color:#fff;
  font:600 15px inherit;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
</style></head><body>
<form id="f" autocomplete="on">
  <h1>Report lead</h1>
  <p>Area riservata. Inserisci utente e password.</p>
  <label for="u">Utente</label><input id="u" type="text" autocomplete="username" required>
  <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
  <label class="ric"><input id="r" type="checkbox" checked> Ricordami su questo dispositivo</label>
  <button id="b" type="submit">Entra</button>
  <div id="err" role="alert"></div>
</form>

var CHIAVE = "report-chiave-v1";
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function leggi(){try{return localStorage.getItem(CHIAVE)||sessionStorage.getItem(CHIAVE);}catch(e){return null;}}
function salva(k,ricorda){try{(ricorda?localStorage:sessionStorage).setItem(CHIAVE,k);}catch(e){}}
function dimentica(){try{localStorage.removeItem(CHIAVE);sessionStorage.removeItem(CHIAVE);}catch(e){}}
async function decifra(grezza){
  var k = await crypto.subtle.importKey("raw", b64(grezza), "AES-GCM", false, ["decrypt"]);
  var chiaro = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(DATI.iv)}, k, b64(DATI.dati));
  return new TextDecoder().decode(chiaro);
}
// A pagina ancora in caricamento document.open() non svuota la pagina e il
// report finirebbe sotto il modulo: si aspetta che il caricamento finisca.
function mostra(html){
  function scrivi(){ document.open(); document.write(html); document.close(); }
  if (document.readyState === "complete") scrivi();
  else window.addEventListener("load", function(){ setTimeout(scrivi, 0); }, {once:true});
}
async function deriva(u, p){
  var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(u.trim().toLowerCase()+"\n"+p),
    "PBKDF2", false, ["deriveBits"]);
  var bits = await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256",
    salt:new TextEncoder().encode(DATI.sale), iterations:DATI.iter}, base, 256);
  var a = new Uint8Array(bits), s = ""; for (var i=0;i<a.length;i++) s += String.fromCharCode(a[i]);
  return btoa(s);
}
(async function(){
  var k = leggi();
  if (k) { try { mostra(await decifra(k)); return; } catch(e) { dimentica(); } }
  document.getElementById("u").focus();
})();
document.getElementById("f").addEventListener("submit", async function(ev){
  ev.preventDefault();
  var b = document.getElementById("b"), err = document.getElementById("err");
  b.disabled = true; err.textContent = "";
  try {
    var k = await deriva(document.getElementById("u").value, document.getElementById("p").value);
    var html = await decifra(k);
    // Prima di sostituire la pagina: dopo, il modulo non esiste piu'.
    salva(k, document.getElementById("r").checked);
    mostra(html);
  } catch(e) {
    err.textContent = "Utente o password non corretti.";
    b.disabled = false;
  }
});
